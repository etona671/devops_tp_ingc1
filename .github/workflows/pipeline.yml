name: Pipeline deployement application python

on: 
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]


jobs:
  
    test-code:
      runs-on: [self-hosted, Linux, X64]

      steps:
        - name: Checout code
          uses: actions/checkout@v4

        - name: Setup python
          uses: actions/setup-python@v5
          with:
            python-version: '3.12' 

        - name: Installer les dépendances
          run: |
            python -m pip install --upgrade pip   
            pip install -r requirements.txt

        - name: Exécuter les tests
          env:
            METRICS_ENDPOINT: .
          run: pytest app/tests/ -q 
      
#Vérification de la sécurité du code avec Bandit
    security-check:
      runs-on: [self-hosted, Linux, X64]
      needs: test-code

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup python
          uses: actions/setup-python@v5
          with:
            python-version: '3.12' 

        - name: Installer les dépendances
          run: |
            python -m pip install --upgrade pip   
            pip install bandit

        - name: Exécuter Bandit pour vérifier la sécurité du code
          run: bandit -r app/ -ll

#Construction et publication de l'image Docker
    build-and-push-docker-image:
      runs-on: [self-hosted, Linux, X64]
      needs: test-code

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/devops_tp_ingc1:latest
              ${{ secrets.DOCKER_USERNAME }}/devops_tp_ingc1:${{ github.sha }}